services:
  postgres:
    image: postgres:15-alpine
    container_name: orchestrix-postgres
    environment:
      POSTGRES_USER: orchestrix
      POSTGRES_PASSWORD: orchestrix_dev
      POSTGRES_DB: orchestrix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrix"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orchestrix-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: orchestrix-api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - /app/venv
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://orchestrix:orchestrix_dev@postgres:5432/orchestrix
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - DEBUG=True
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build: .
    container_name: orchestrix-celery
    command: celery -A src.scheduler.celery_tasks worker --loglevel=info
    volumes:
      - .:/app
      - /app/venv
    environment:
      - DATABASE_URL=postgresql://orchestrix:orchestrix_dev@postgres:5432/orchestrix
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
